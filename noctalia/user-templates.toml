[templates.papirus_icons]
input_path = "~/.config/noctalia/templates/papirus-icons/colors"
output_path = "~/.config/noctalia/templates/papirus-icons/colors-final"
post_hook = "bash ~/.config/noctalia/templates/papirus-icons/apply.sh"

[templates.teamspeak]
input_path = "~/.config/noctalia/templates/teamspeak/main.qss"
output_path = "~/.ts3client/styles/DemusDynamic.qss"

[templates.teamspeak_chat]
input_path = "~/.config/noctalia/templates/teamspeak/chat.qss"
output_path = "~/.ts3client/styles/DemusDynamic_chat.qss"